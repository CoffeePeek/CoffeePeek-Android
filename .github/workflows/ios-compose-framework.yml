name: iOS Compose Framework

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compose-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-framework:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build ComposeApp framework for physical devices
        run: >-
          ./gradlew
          --no-daemon
          --no-configuration-cache
          :composeApp:linkDebugFrameworkIosArm64

      - name: Verify and package framework
        shell: bash
        run: |
          set -euo pipefail

          FRAMEWORK_DIR="composeApp/build/bin/iosArm64/debugFramework/ComposeApp.framework"
          FRAMEWORK_BINARY="$FRAMEWORK_DIR/ComposeApp"

          if [[ ! -d "$FRAMEWORK_DIR" || ! -f "$FRAMEWORK_BINARY" ]]; then
            echo "ComposeApp.framework was not produced at $FRAMEWORK_DIR."
            exit 1
          fi

          mkdir -p artifacts
          tar -czf artifacts/ComposeApp-iosArm64-debug.tar.gz \
            -C composeApp/build/bin/iosArm64/debugFramework \
            ComposeApp.framework

          shasum -a 256 artifacts/ComposeApp-iosArm64-debug.tar.gz \
            > artifacts/ComposeApp-iosArm64-debug.tar.gz.sha256

      - name: Upload framework artifact
        uses: actions/upload-artifact@v4
        with:
          name: composeapp-ios-arm64-debug-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
