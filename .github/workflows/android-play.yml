name: Android App Bundle

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_aab:
    name: Build signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found: $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Validate secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for value in \
            KEYSTORE_BASE64 \
            KEYSTORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD
          do
            if [[ -z "${!value}" ]]; then
              echo "Required secret $value is empty"
              exit 1
            fi
          done

      - name: Create local.properties
        shell: bash
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL_MAIN }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          {
            echo "API_BASE_URL=$API_BASE_URL"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
          } > local.properties

      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          umask 077

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/coffeepeek-upload.jks"

      - name: Validate keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore "$RUNNER_TEMP/coffeepeek-upload.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "Keystore is valid."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/coffeepeek-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            :composeApp:bundleRelease

      - name: Verify AAB
        id: aab
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          bundles=(composeApp/build/outputs/bundle/release/*.aab)

          if [[ ${#bundles[@]} -eq 0 ]]; then
            echo "No AAB files found."
            exit 1
          fi

          if [[ ${#bundles[@]} -gt 1 ]]; then
            echo "Expected one AAB, found ${#bundles[@]}:"
            printf '%s\n' "${bundles[@]}"
            exit 1
          fi

          AAB="${bundles[0]}"

          echo "Found AAB:"
          echo "$AAB"

          jarsigner -verify -strict "$AAB"

          mkdir -p dist

          cp "$AAB" dist/coffeepeek-release.aab

          SHA256="$(sha256sum dist/coffeepeek-release.aab | awk '{print $1}')"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "AAB SHA-256: $SHA256"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffeepeek-release-aab
          path: dist/coffeepeek-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        shell: bash
        run: |
          {
            echo "### CoffeePeek Android App Bundle"
            echo ""
            echo "✅ Signed AAB built successfully"
            echo ""
            echo "- Artifact: \`coffeepeek-release-aab\`"
            echo "- File: \`coffeepeek-release.aab\`"
            echo "- Package: \`com.coffeepeek\`"
            echo "- SHA-256: \`${{ steps.aab.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"