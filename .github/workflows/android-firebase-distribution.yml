name: Android CI + Firebase App Distribution

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 SDK components
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Create local.properties for CI builds
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          API_BASE_URL="${{ vars.API_BASE_URL_CI }}"
          if [ -z "$API_BASE_URL" ]; then
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "API_BASE_URL_CI is required for Firebase tester builds."
              exit 1
            fi
            API_BASE_URL="https://example.com/"
          fi

          if [ "${{ github.event_name }}" != "pull_request" ] && [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "GOOGLE_WEB_CLIENT_ID is required for Firebase tester builds."
            exit 1
          fi

          printf 'API_BASE_URL=%s\nGOOGLE_WEB_CLIENT_ID=%s\n' "$API_BASE_URL" "$GOOGLE_WEB_CLIENT_ID" > local.properties

      - name: Assemble debug APK
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-daemon :composeApp:assembleDebug

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "Required Android signing secret $value is empty."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coffeepeek-release.jks"

      - name: Assemble signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/coffeepeek-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache :composeApp:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: composeapp-firebase-apk
          path: composeApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
          
  distribute-to-firebase:
    needs: build-apk
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Validate Firebase secrets
        id: firebase
        shell: bash
        run: |
          enabled=true
          if [ -z "${{ secrets.FIREBASE_APP_ID_ANDROID }}" ]; then
            echo "FIREBASE_APP_ID_ANDROID is empty."
            enabled=false
          fi
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is empty."
            enabled=false
          fi
          if [ -z "${{ secrets.FIREBASE_TESTER_GROUPS }}" ] && [ -z "${{ secrets.FIREBASE_TESTERS }}" ]; then
            echo "Either FIREBASE_TESTER_GROUPS or FIREBASE_TESTERS must be set."
            enabled=false
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = "false" ]; then
            echo "::notice::Firebase distribution skipped due to missing secrets."
          fi

      - name: Download APK artifact
        if: steps.firebase.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: composeapp-firebase-apk
          path: artifacts

      - name: Resolve APK path
        if: steps.firebase.outputs.enabled == 'true'
        id: apk
        shell: bash
        run: |
          shopt -s nullglob
          files=(artifacts/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No APK was found in artifacts directory."
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        if: steps.firebase.outputs.enabled == 'true'
        id: notes
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "text=Manual build from workflow #${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            message="$COMMIT_MESSAGE"
            if [ -z "$message" ]; then
              message="Build from commit ${{ github.sha }}"
            fi
            {
              echo "text<<EOF"
              printf '%s\n' "$message"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Distribute build to Firebase
        if: steps.firebase.outputs.enabled == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          testers: ${{ secrets.FIREBASE_TESTERS }}
          file: ${{ steps.apk.outputs.path }}
          releaseNotes: ${{ steps.notes.outputs.text }}
